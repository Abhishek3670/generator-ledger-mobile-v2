description: |
  Build the 12 shared UI components identified in PLAN.md §6.
  Each component must use AppColors, AppTypography, and AppDimensions exclusively.
  No hardcoded colors, font sizes, or radii.

  Reference the HTML designs in stitch_generator_ledger_design/screens/ for
  layout structure. Translate Tailwind classes into Flutter equivalents.

acceptance_criteria:
  - AppBottomNavBar — 4-tab nav (Dashboard, Bookings, Genset, Vendors) with active indicator
  - AdminBottomNavBar — 3-tab nav (Health, Users, Integrations)
  - FloatingSearchFAB — pill-shaped search bar + circular FAB, positioned bottom
  - ExpandableFABMenu — FAB that expands vertically with sub-options + backdrop blur
  - StatusBadge — pill-shaped, prefix icon (✓/⏱/✕), semantic colors per status
  - DirectoryCard — white card, 1px border, rounded-lg, optional dark header row
  - SectionHeader — label-caps category + display-lg/headline-md title + body description
  - ModalScaffold — centered floating card, backdrop blur, sticky header/footer, close button
  - SwipeActionCard — flutter_slidable wrapper with Modify (amber) and Delete (red) actions
  - BackdropBlurOverlay — semi-transparent slate overlay with backdrop blur
  - SideNavigationDrawer — drawer with user profile, nav links, settings/logout
  - DarkHeaderCard — card header with primary bg, white text, flex row content
  - All widgets documented with dartdoc comments
  - flutter analyze passes

