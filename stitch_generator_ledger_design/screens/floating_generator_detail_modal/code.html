<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Generator Details Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "outline-variant": "#c6c6cd",
                      "text-secondary": "#475569",
                      "error": "#ba1a1a",
                      "tertiary": "#000000",
                      "inverse-surface": "#2f3131",
                      "tertiary-fixed-dim": "#f9bd22",
                      "primary-fixed-dim": "#bec6e0",
                      "on-error": "#ffffff",
                      "inverse-primary": "#bec6e0",
                      "on-surface": "#1a1c1c",
                      "on-tertiary-container": "#a87d00",
                      "on-tertiary-fixed": "#261a00",
                      "outline": "#76777d",
                      "on-secondary-fixed-variant": "#3c475a",
                      "secondary-fixed": "#d8e3fb",
                      "on-primary-fixed-variant": "#3f465c",
                      "on-tertiary": "#ffffff",
                      "surface-container-low": "#f3f3f3",
                      "on-tertiary-fixed-variant": "#5c4300",
                      "on-primary-fixed": "#131b2e",
                      "on-surface-variant": "#45464d",
                      "on-background": "#1a1c1c",
                      "secondary-container": "#d5e0f8",
                      "tertiary-fixed": "#ffdf9f",
                      "primary-container": "#131b2e",
                      "surface": "#f9f9f9",
                      "secondary-fixed-dim": "#bcc7de",
                      "warning-amber": "#d97706",
                      "tertiary-container": "#261a00",
                      "surface-container-lowest": "#ffffff",
                      "surface-container-high": "#e8e8e8",
                      "background": "#f9f9f9",
                      "surface-container-highest": "#e2e2e2",
                      "primary": "#000000",
                      "surface-variant": "#e2e2e2",
                      "surface-bright": "#f9f9f9",
                      "surface-tint": "#565e74",
                      "success-emerald": "#059669",
                      "on-error-container": "#93000a",
                      "on-primary-container": "#7c839b",
                      "border-slate": "#cbd5e1",
                      "on-secondary": "#ffffff",
                      "surface-light": "#f8fafc",
                      "inverse-on-surface": "#f0f1f1",
                      "error-container": "#ffdad6",
                      "primary-fixed": "#dae2fd",
                      "on-primary": "#ffffff",
                      "surface-dim": "#dadada",
                      "secondary": "#545f73",
                      "on-secondary-fixed": "#111c2d",
                      "on-secondary-container": "#586377",
                      "surface-container": "#eeeeee",
                      "danger-rose": "#dc2626"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "md": "16px",
                      "xl": "32px",
                      "gutter": "24px",
                      "sm": "8px",
                      "container-max": "1200px",
                      "xs": "4px",
                      "unit": "4px",
                      "lg": "24px"
              },
              "fontFamily": {
                      "body-sm": ["Inter"],
                      "label-caps": ["Space Grotesk"],
                      "body-md": ["Inter"],
                      "headline-sm": ["Space Grotesk"],
                      "display-lg": ["Space Grotesk"],
                      "headline-md": ["Space Grotesk"]
              },
              "fontSize": {
                      "body-sm": ["14px", {"lineHeight": "22px", "fontWeight": "400"}],
                      "label-caps": ["11px", {"lineHeight": "16px", "letterSpacing": "0.2em", "fontWeight": "600"}],
                      "body-md": ["16px", {"lineHeight": "26px", "fontWeight": "400"}],
                      "headline-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                      "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}]
              }
            }
          }
        }
    </script>
<style>
        /* Hide scrollbar for clean UI in modal */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-surface font-body-sm text-on-surface antialiased">
<!-- Background Context (Simulated generators directory) -->
<div class="fixed inset-0 z-0 bg-surface-container-low opacity-50 blur-sm pointer-events-none"></div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-primary/40 backdrop-blur-sm p-4 pb-0 sm:p-6 transition-opacity">
<!-- Modal Container -->
<div class="bg-surface-container-lowest rounded-xl shadow-2xl w-full max-w-md transform transition-all relative flex flex-col max-h-[90vh] border border-warning-amber overflow-hidden">
<!-- Header -->
<div class="px-6 py-5 border-b border-border-slate flex justify-between items-start bg-surface-light flex-shrink-0 sticky top-0 z-10">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Generator Details</h2>
<div class="flex items-center gap-2 mb-sm">
<span class="font-body-md text-body-md font-semibold text-on-surface">GEN-100KVA-6R-01</span>
</div>
<!-- Badges -->
<div class="flex flex-wrap gap-2 items-center mt-1">
<!-- Status Badge -->
<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-success-emerald/10 text-success-emerald font-label-caps text-label-caps border border-success-emerald/20">
<span class="material-symbols-outlined text-[14px]">check</span> Available
                        </span>
<!-- Category Badges -->
<span class="px-2 py-0.5 rounded-full bg-surface-container-high text-on-surface-variant font-label-caps text-label-caps">RETAILER GENSET</span>
<span class="px-2 py-0.5 rounded-full bg-surface-container-high text-on-surface-variant font-label-caps text-label-caps">100 KVA</span>
<span class="px-2 py-0.5 rounded-full bg-surface-container-high text-on-surface-variant font-label-caps text-label-caps">6R</span>
</div>
</div>
<!-- Close Button -->
<button class="bg-surface-container-lowest border border-border-slate rounded-full px-4 py-1.5 text-body-sm text-text-secondary hover:bg-surface-container-high transition-colors focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary shadow-sm flex items-center gap-1" type="button"><span class="material-symbols-outlined text-[16px]">close</span><span class="font-label-caps text-label-caps hidden sm:inline">Close</span></button>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto p-md space-y-xl bg-surface-light">
<!-- Create Booking Section -->
<section>
<div class="bg-surface-container-lowest border border-border-slate rounded-lg p-md shadow-[0_1px_2px_0_rgba(15,23,42,0.05)]">
<h3 class="font-headline-sm text-[16px] leading-[24px] text-primary mb-sm">Create Booking</h3>
<form class="space-y-md">
<!-- Vendor Dropdown -->
<div>
<label class="block font-label-caps text-label-caps text-text-secondary mb-1">VENDOR</label>
<div class="relative">
<select class="block w-full rounded-lg border-border-slate bg-surface-container-lowest text-on-surface shadow-sm focus:border-primary focus:ring-0 focus:shadow-[0_0_0_3px_rgba(15,23,42,0.1)] py-2.5 pl-3 pr-10 appearance-none transition-shadow text-body-sm h-[42px]">
<option disabled="" selected="" value="">Select a vendor</option>
<option value="v1">Shakutalum Guest House</option>
<option value="v2">Mallu Logistics</option>
<option value="v3">RS Marriage Hall</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-text-secondary">
<span class="material-symbols-outlined text-[20px]">expand_more</span>
</div>
</div>
</div>
<!-- Date Picker -->
<div>
<label class="block font-label-caps text-label-caps text-text-secondary mb-1">BOOKED DATE</label>
<div class="relative">
<input class="block w-full rounded-lg border-border-slate bg-surface-container-lowest shadow-sm focus:border-primary focus:ring-0 focus:shadow-[0_0_0_3px_rgba(15,23,42,0.1)] py-2.5 px-3 transition-shadow text-body-sm" placeholder="mm/dd/yyyy" type="date">
</div>
</div>
<!-- Remarks -->
<div>
<label class="block font-label-caps text-label-caps text-text-secondary mb-1">REMARKS (OPTIONAL)</label>
<textarea class="block w-full rounded-lg border-border-slate bg-surface-container-lowest shadow-sm focus:border-primary focus:ring-0 focus:shadow-[0_0_0_3px_rgba(15,23,42,0.1)] py-2.5 px-3 transition-shadow text-body-sm resize-none" placeholder="Enter remarks..." rows="2"></textarea>
</div>
<!-- Submit Button -->
<button class="w-full flex items-center justify-center gap-2 bg-primary text-on-primary font-label-caps text-label-caps rounded-full px-6 py-2.5 hover:bg-surface-tint transition-colors focus:outline-none focus:ring-2 focus:ring-primary/20 shadow-sm mt-2" type="button">
                                CREATE BOOKING
                                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</div>
</section>
<!-- Recent Bookings Section -->
<section>
<h3 class="font-headline-sm text-[16px] leading-[24px] text-primary mb-md">Recent Bookings</h3>
<div class="space-y-sm">
<!-- Booking Card 1 -->
<div class="bg-surface-container-lowest border border-border-slate rounded-lg p-3 shadow-[0_1px_2px_0_rgba(15,23,42,0.05)] flex justify-between items-center hover:border-outline-variant transition-colors cursor-pointer">
<div>
<div class="font-body-sm text-[13px] text-text-secondary mb-0.5">BKG-20260414-00004</div>
<div class="font-body-md text-[15px] font-medium text-on-surface">Shakutalum Guest House</div>
<div class="flex items-center gap-2 mt-1">
<span class="material-symbols-outlined text-[14px] text-text-secondary">calendar_today</span>
<span class="font-body-sm text-[13px] text-text-secondary">2026-04-25</span>
</div>
</div>
<div class="flex flex-col items-end">
<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-success-emerald/10 text-success-emerald font-label-caps text-[9px] border border-success-emerald/20 mb-1">
<span class="material-symbols-outlined text-[12px]">check</span> Confirmed
                                </span>
</div>
</div>
<!-- Booking Card 2 -->
<div class="bg-surface-container-lowest border border-border-slate rounded-lg p-3 shadow-[0_1px_2px_0_rgba(15,23,42,0.05)] flex justify-between items-center hover:border-outline-variant transition-colors cursor-pointer">
<div>
<div class="font-body-sm text-[13px] text-text-secondary mb-0.5">BKG-20260205-00011</div>
<div class="font-body-md text-[15px] font-medium text-on-surface">Mallu Logistics</div>
<div class="flex items-center gap-2 mt-1">
<span class="material-symbols-outlined text-[14px] text-text-secondary">calendar_today</span>
<span class="font-body-sm text-[13px] text-text-secondary">2026-02-25</span>
</div>
</div>
<div class="flex flex-col items-end">
<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-success-emerald/10 text-success-emerald font-label-caps text-[9px] border border-success-emerald/20 mb-1">
<span class="material-symbols-outlined text-[12px]">check</span> Confirmed
                                </span>
</div>
</div>
<!-- View All Button -->
<button class="w-full flex items-center justify-center gap-2 bg-surface-container hover:bg-surface-container-high text-on-surface font-label-caps text-[12px] leading-[20px] py-2 px-4 rounded-full transition-colors mt-2 border border-border-slate">
                            VIEW ALL BOOKINGS
                            <span class="material-symbols-outlined text-[16px]">list</span>
</button>
</div>
</section>
<!-- Extra padding for bottom safe area on mobile -->
<div class="h-4 sm:h-0"></div>
</div>
</div>
</div>


</body></html>
