name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Export method"
        required: true
        default: "development"
        type: choice
        options:
          - development
          - ad-hoc
          - app-store

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Flutter
      # ---------------------------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter
        run: |
          flutter --version
          flutter doctor -v

      # ---------------------------------------------------------
      # Dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: flutter pub get

      # ---------------------------------------------------------
      # iOS Flutter artifacts
      # ---------------------------------------------------------
      - name: Precache iOS artifacts
        run: flutter precache --ios

      # ---------------------------------------------------------
      # CocoaPods
      # ---------------------------------------------------------
      - name: Install iOS pods
        working-directory: ios
        run: pod install --repo-update

      # ---------------------------------------------------------
      # Build
      # ---------------------------------------------------------
      - name: Build iOS
        run: flutter build ios --release --no-codesign

      # ---------------------------------------------------------
      # Create IPA
      # ---------------------------------------------------------
      - name: Create IPA
        working-directory: build/ios/iphoneos
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R Runner.app Payload/
      
          mkdir -p ../ipa
      
          cd Payload
          zip -r ../ipa/Runner.ipa Runner.app
          
      # ---------------------------------------------------------
      # Verify IPA
      # ---------------------------------------------------------
      - name: Verify IPA
        run: |
          echo "Checking IPA structure..."
          unzip -l build/ios/ipa/Runner.ipa | head -30
      
          echo "Checking for Payload/Runner.app..."
          unzip -l build/ios/ipa/Runner.ipa | grep "Payload/Runner.app"
          
      # ---------------------------------------------------------
      # Upload
      # ---------------------------------------------------------
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.event.inputs.export_method }}
          path: build/ios/ipa/Runner.ipa
          if-no-files-found: error
