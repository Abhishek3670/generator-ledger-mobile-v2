name: ledger
description: "Generator ledger mobile application."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.1+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  go_router: ^14.0.0
  google_fonts: ^6.0.0
  table_calendar: ^3.1.0
  fl_chart: ^0.68.0
  flutter_slidable: ^3.1.0
  intl: ^0.19.0
  connectivity_plus: ^5.0.2
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  app_links: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "logo.png"
  adaptive_icon_background: "#0f172a"
  adaptive_icon_foreground: "logo.png"

flutter_native_splash:
  color: "#0f172a"
  image: "splash_logo.png"
  android_12:
    color: "#0f172a"
    image: "splash_icon_only.png"
    icon_background_color: "#0f172a"
